# Kitty Terminal Configuration
# Theme: managed by the Quickshell settings panel (Super + ,)

# Fonts
# Aangepast naar JetBrainsMono Nerd Font om je Fish prompt iconen te repareren!
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window Layout & Padding
window_padding_width 12
confirm_os_window_close 0

# Enable the cursor trail animation
cursor_trail 3

# Control how smoothly the trail fades out (fastest and slowest decay times in seconds)
cursor_trail_decay 0.1 0.4

# The minimum distance (in cells) the cursor must move before a trail starts
cursor_trail_start_threshold 2

# Cursor
cursor_shape          beam
cursor_beam_thickness 1.5

shell /usr/bin/fish


# Colours, font size, padding and cursor shape come from hearthshell (an include is added at the end).
