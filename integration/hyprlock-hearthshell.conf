# hearthshell hyprlock template: colours come from hearthshell-hyprlock.conf (written by hearthshell).
# Try it with:  hyprlock -c ~/.config/hypr/hyprlock-hearthshell.conf
source = @CONF@/hypr/hearthshell-hyprlock.conf

# ~/.config/hypr/hyprlock.conf

animations {
    enabled = true
    # no fade-out: exit instantly on Enter so the Quickshell morph starts at once
    animation = fadeOut, 0
}

general {
    hide_cursor = true
}

background {
    monitor =
    # Use a static wallpaper path or disable blur so Quickshell overlay isn't blurred
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.8
}

input-field {
    monitor =
    size = 220, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.15
    dots_center = true
    fade_on_empty = false
    font_color = $qs_fg
    inner_color = $qs_inner
    outer_color = $qs_outer
    position = 0, -150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +%H
    color = $qs_fg
    font_size = 52
    font_family = Inter SemiBold
    position = 0, 30
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +%M)</b>"
    color = $qs_accent
    font_size = 52
    font_family = Inter ExtraBold
    position = 0, -30
    halign = center
    valign = center
}
